name: BUILD_FFMPEG_BY_MANUAL_V3(BTBN)

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: "指定BtbN分支"
        required: true
        default: "master"
        type: choice
        options:
          - "master"
      base_commit_id:
        description: "指定BtbN使用commit id版本"
        required: true
        default: "HEAD~0"
        type: string
      ffmpeg_branch:
        description: "指定ffmpeg分支"
        required: true
        default: "master"
        type: choice
        options:
          - "master"
          - "8.1"
          - "8.0"
      svt_av1_commit_id:
        description: "指定svt-av1使用commit id版本"
        required: true
        default: "v4.1.0"
        type: string
      svt_av1_version_select:
        description: "select custom svt_av1 version"
        default: "auto"
        type: choice
        options:
          - "static"
          - "auto"
          - "custom"
      mingw_w64_version_select:
        description: "select custom mingw_w64 version"
        default: "auto"
        type: choice
        options:
          - "static"
          - "auto"
      use_default_svt_av1_version:
        description: "use default svt_av1 version"
        default: false
        type: boolean
      release_archives:
        description: "enable release archives"
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}

jobs:
  pre:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      default_commit_id: HEAD~0
      default_branch: ${{ steps.set_global_params.outputs.default_branch }}
      mingw_w64_commit_id_auto: ${{ steps.set_global_params_mingw_w64.outputs.mingw_w64_commit_id }}
      mingw_w64_commit_id_static: "v14.0.0"
      svt_av1_commit_id_auto: ${{ steps.set_global_params_svt_av1.outputs.svt_av1_commit_id }}
      svt_av1_commit_id_static: "v4.1.0"
    steps:
      - name: set_global_params
        id: set_global_params
        run: |
          echo "default_branch=main" >> "$GITHUB_OUTPUT"

      - name: set_global_params (mingw_w64)
        id: set_global_params_mingw_w64
        run: |
          branch=master
          commit_id=$(git ls-remote https://github.com/mingw-w64/mingw-w64.git refs/heads/$branch | cut -f1)
          echo "mingw_w64_commit_id=$commit_id" >> "$GITHUB_OUTPUT"

      - name: set_global_params (svt_av1)
        id: set_global_params_svt_av1
        run: |
          branch=master
          commit_id=$(git ls-remote https://gitlab.com/AOMediaCodec/SVT-AV1.git refs/heads/$branch | cut -f1)
          echo "svt_av1_commit_id=$commit_id" >> "$GITHUB_OUTPUT"

  select:
    runs-on: ubuntu-latest
    needs: [pre]
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    outputs:
      mingw_w64_commit_id: ${{ steps.set_global_params_mingw_w64.outputs.mingw_w64_commit_id }}
      svt_av1_commit_id: ${{ steps.set_global_params_svt_av1.outputs.svt_av1_commit_id }}
    steps:
      - name: set_global_params (mingw_w64)
        id: set_global_params_mingw_w64
        run: |
          if [ "${{ inputs.mingw_w64_version_select }}" = "auto" ]; then
            echo "mingw_w64_commit_id=${{ needs.pre.outputs.mingw_w64_commit_id_auto }}" >> "$GITHUB_OUTPUT"
          else
            echo "mingw_w64_commit_id=${{ needs.pre.outputs.mingw_w64_commit_id_static }}" >> "$GITHUB_OUTPUT"
          fi

      - name: set_global_params (svt_av1)
        id: set_global_params_svt_av1
        run: |
          if [ "${{ inputs.svt_av1_version_select }}" = "auto" ]; then
            echo "svt_av1_commit_id=${{ needs.pre.outputs.svt_av1_commit_id_auto }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.svt_av1_version_select }}" = "static" ]; then
            echo "svt_av1_commit_id=${{ needs.pre.outputs.svt_av1_commit_id_static }}" >> "$GITHUB_OUTPUT"
          else
            echo "svt_av1_commit_id=${{ inputs.svt_av1_commit_id }}" >> "$GITHUB_OUTPUT"
          fi

  build-win64:
    needs: [pre, select]
    uses: ./.github/workflows/call-build-ffmpeg.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      target: win64
      ffmpeg_branch: ${{ inputs.ffmpeg_branch }}
      base_branch: ${{ inputs.base_branch }}
      base_commit_id: ${{ inputs.base_commit_id }}
      use_default_svt_av1_version: ${{ inputs.use_default_svt_av1_version }}
      svt_av1_commit_id: ${{ needs.select.outputs.svt_av1_commit_id }}
      mingw_w64_commit_id: ${{ needs.select.outputs.mingw_w64_commit_id }}

  build-linux64:
    needs: [pre, select]
    uses: ./.github/workflows/call-build-ffmpeg.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      target: linux64
      ffmpeg_branch: ${{ inputs.ffmpeg_branch }}
      base_branch: ${{ inputs.base_branch }}
      base_commit_id: ${{ inputs.base_commit_id }}
      use_default_svt_av1_version: ${{ inputs.use_default_svt_av1_version }}
      svt_av1_commit_id: ${{ needs.select.outputs.svt_av1_commit_id }}
      mingw_w64_commit_id: ${{ needs.select.outputs.mingw_w64_commit_id }}

  build-linuxarm64:
    needs: [pre, select]
    uses: ./.github/workflows/call-build-ffmpeg.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    with:
      runner: ubuntu-latest
      target: linuxarm64
      ffmpeg_branch: ${{ inputs.ffmpeg_branch }}
      base_branch: ${{ inputs.base_branch }}
      base_commit_id: ${{ inputs.base_commit_id }}
      use_default_svt_av1_version: ${{ inputs.use_default_svt_av1_version }}
      svt_av1_commit_id: ${{ needs.select.outputs.svt_av1_commit_id }}
      mingw_w64_commit_id: ${{ needs.select.outputs.mingw_w64_commit_id }}

  release:
    needs: [pre, select, build-win64, build-linux64, build-linuxarm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download FFmpeg archives
        uses: actions/download-artifact@v8
        with:
          pattern: ffmpeg-bin-*
          merge-multiple: true
          path: ${{ github.workspace }}/archives

      - name: show zip files
        run: |
          ls -R ${{ github.workspace }}/archives

      - name: Get current date time
        run: |
          echo "current_date_time=$(date -d '8 hour' -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"

      - name: Release FFmpeg archives
        uses: softprops/action-gh-release@v3
        if: ${{ inputs.release_archives }}
        with:
          tag_name: "V2-${{ env.current_date_time }}"
          name: "V2-${{ env.current_date_time }}"
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          body: |
            FFmpeg nonfree build result (BtbN/FFmpeg-Builds).
            FFmpeg from [${{ inputs.ffmpeg_branch }}] 
            BtbN from [${{ inputs.base_branch }}] [${{ inputs.base_commit_id }}]
            svt_av1 from [(use default): ${{ inputs.use_default_svt_av1_version }}] [(in the case of custom) ${{ needs.select.outputs.svt_av1_commit_id }}]
            mingw_w64 from [${{ needs.select.outputs.mingw_w64_commit_id }}]
          files: |
            ${{ github.workspace }}/archives/**
