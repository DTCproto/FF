name: BUILD_DOCKER(BTBN)

on:
  workflow_dispatch:
    inputs:
      build_slim:
        description: "enable slim build"
        default: true
        type: boolean
      release_archives:
        description: "enable release archives"
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    # 同一个标签，不能多次push，会强制清空覆盖所有数据
    # strategy:
    #   matrix:
    #     os: [linux/amd64, linux/arm64]
    steps:
      - name: Free Disk-Space
        run: df -h && sudo apt-get clean && docker system prune -a -f && sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc && df -h

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:qemu-v9.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install APT dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: git curl wget

      - name: init
        run: |
          cp -rf ${{ github.workspace }}/conf/* ${{ github.workspace }}/mainline/
          ls ${{ github.workspace }}/mainline/

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Login to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: set lower case name
        run: |
          echo "ACTOR_LC=${ACTOR,,}" >>${GITHUB_ENV}
          echo "REPOSITORY_LC=${REPOSITORY,,}" >>${GITHUB_ENV}
        env:
          ACTOR: '${{ github.actor }}'
          REPOSITORY: '${{ github.repository }}'

      # 自动标签
      #- name: Extract metadata (tags, labels) for Docker
      #  id: meta
      #  uses: docker/metadata-action@v5
      #  with:
      #    images: |
      #      ${{ secrets.DOCKERHUB_USERNAME }}/nginx
      #      ghcr.io/${{ github.repository }}

      - name: Build And Push (ffmpeg)
        if: ${{ inputs.build_slim }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/mainline/
          file: ${{ github.workspace }}/mainline/slim.Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          #build-args: |
          #  FFMPEG_COMMIT_ID=${{ inputs.ffmpeg_commit_id }}
          push: ${{ inputs.release_archives }}
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg:bookworm-slim
            ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg:slim
            ${{ secrets.DOCKERHUB_USERNAME }}/ffmpeg:latest
            ghcr.io/${{ env.ACTOR_LC }}/ffmpeg:bookworm-slim
            ghcr.io/${{ env.ACTOR_LC }}/ffmpeg:slim
            ghcr.io/${{ env.ACTOR_LC }}/ffmpeg:latest
          cache-from: type=registry,ref=ghcr.io/${{ env.ACTOR_LC }}/ffmpeg:latest
          cache-to: type=inline
